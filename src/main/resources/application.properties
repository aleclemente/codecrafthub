# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=CodeCraftHub

# Logging Configuration
logging.level.root=INFO
logging.level.com.codecrafthub=DEBUG

# Jackson Configuration for JSON formatting
spring.jackson.serialization.indent_output=true
spring.jackson.time-zone=UTC

# File Path Configuration
app.courses.file.path=src/main/resources/courses.json
